{% include "blocks/heading.html" %}
<div class="flex flex-wrap gap-2">
  {% for group in group_posts(blog_posts(), 'tag') %}
    <a href="{{ group_url('tag', group.key)|url }}" class="rounded-full bg-zinc-100 px-3 py-1 text-sm text-zinc-700 transition hover:bg-teal-50 hover:text-teal-800 dark:bg-zinc-900 dark:text-zinc-300 dark:hover:bg-teal-950 dark:hover:text-teal-300">{{ group.key }} <span class="text-zinc-400 dark:text-zinc-500">{{ group.posts|length }}</span></a>
  {% endfor %}
</div>
