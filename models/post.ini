[model]
name = Blog Post
label = {{ this.title }}

[children]
replaced_with = none

[fields.title]
label = Title
type = string
size = large

[fields.pub_date]
label = Publication date
description = Posts without a date are drafts.
type = date
width = 1/2

[fields.author]
label = Author
type = string
width = 1/2

[fields.tags]
label = Tags
description = One tag per line.
type = strings
width = 1/2

[fields.language]
label = Language
type = string
width = 1/2

[fields.summary]
label = Summary
description = Shown in post lists and feeds. Defaults to the first paragraph of the body.
type = markdown

[fields.body]
label = Body
type = markdown
