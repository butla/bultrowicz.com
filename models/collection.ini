[model]
name = Post Collection
label = {{ this.title }}
description = A listing of blog posts, optionally grouped, generating per-group sub-pages and feeds.

[fields.title]
label = Title
type = string

[fields.posts]
label = Posts
type = select
choices = published, drafts
choice_labels = Published posts, Drafts
default = published
width = 1/3

[fields.group_by]
label = Group the listing by
description = Leave empty for a flat list of posts with excerpts.
type = select
choices = tag, year, author, language, initial
choice_labels = Tag, Year, Author, Language, First letter of the title
width = 1/3

[fields.group_pages]
label = Generate a sub-page (with an Atom feed) for each
type = select
choices = tag, year, author, language
choice_labels = Tag, Year, Author, Language
width = 1/3

[fields.feed]
label = Atom feed of this page (atom.xml)
type = boolean
default = no

[fields.intro]
label = Introduction
type = markdown
